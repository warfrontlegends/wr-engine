[workspace]
members  = ["crates/*"]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "MIT OR Apache-2.0"
repository = "https://github.com/warfrontlegends/wr-engine"
homepage   = "https://warfrontlegends.com"
authors    = ["Warfront Legends Team <team@warfrontlegends.com>"]
rust-version = "1.83"

[workspace.dependencies]
# --- determinism utilities ---
serde       = { version = "1",     features = ["derive"] }
serde_bytes = { version = "0.11" }
fixed       = { version = "=1.28.0",  features = ["serde"] }
bincode     = { version = "1.3" }
# Exact-pin parity with `fixed` so a patch-release of Blake3 cannot
# silently drift the canonical hash function used in the determinism
# contract.
blake3      = { version = "=1.8.5" }

# --- error / logging (used by higher crates later) ---
thiserror   = { version = "1" }
anyhow      = { version = "1" }

# --- testing ---
proptest    = { version = "1" }

[profile.release]
codegen-units = 1
lto           = "fat"
panic         = "abort"
opt-level     = 3

[profile.dev]
opt-level = 1
